name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-

      - name: Cache Android NDK r25b
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: android-ndk-25.1.8937393

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip python3-dev git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        # Pin p4a to mid-2024: latest p4a builds Python 3.14 which breaks kivy 2.3.0
        # (kivy 2.3.0 requires cython<=3.0.0 which can't compile against Python 3.14)
        run: pip install --upgrade cython virtualenv buildozer "python-for-android==2024.01.21"

      - name: Set up Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses 2>/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          # p4a looks for sdkmanager at the old tools/bin path — create a shim
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_HOME/tools/bin/sdkmanager"

          # Insert sdk/ndk paths into [app] section (before [buildozer])
          sed -i "s|^\[buildozer\]|android.sdk_path = ${ANDROID_HOME}\nandroid.ndk_path = ${ANDROID_HOME}/ndk/25.1.8937393\n\n[buildozer]|" buildozer.spec

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-debug
          path: bin/*.apk
          retention-days: 90
