name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v3-

      - name: Cache Android NDK r25b
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: android-ndk-25.1.8937393

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip python3-dev git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Pin python3/pip3 to Python 3.11
        # The system python3 on this runner is Python 3.14, which removed the `cgi`
        # module that Cython 0.29.33 needs. p4a spawns subprocesses that call
        # `python3` by name, so redirect /usr/local/bin (searched before /usr/bin)
        # to Python 3.11. We leave /usr/bin/python3 alone so apt_pkg stays intact.
        run: |
          PYTHON311="$(which python)"
          sudo ln -sf "$PYTHON311" /usr/local/bin/python3
          sudo ln -sf "$(which pip)" /usr/local/bin/pip3

      - name: Install buildozer
        # kivy 2.2.1 caps Cython at <=0.29.33 and rejects Cython 3.x.
        # p4a 2023.09.16 builds Python 3.11 for Android (avoids 3.14 breakage) and
        # uses setup.py kivy build path (kivy 2.3.0's pyproject.toml breaks cross-compile).
        run: pip install "cython==0.29.33" virtualenv buildozer "python-for-android==2023.09.16"

      - name: Set up Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses 2>/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          # p4a looks for sdkmanager at the old tools/bin path — create a shim
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_HOME/tools/bin/sdkmanager"

          # Insert sdk/ndk paths into [app] section (before [buildozer])
          sed -i "s|^\[buildozer\]|android.sdk_path = ${ANDROID_HOME}\nandroid.ndk_path = ${ANDROID_HOME}/ndk/25.1.8937393\n\n[buildozer]|" buildozer.spec

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-debug
          path: bin/*.apk
          retention-days: 90
