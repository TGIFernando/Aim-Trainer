name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip python3-dev git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer cython virtualenv

      - name: Bootstrap Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          # Re-use the runner's pre-installed cmdline-tools (avoids downloading)
          ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"

          # Compatibility shim — older p4a/buildozer looks here
          mkdir -p "$SDK/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Accept all licenses (writes hash files into $SDK/licenses/)
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses 2>/dev/null || true

          # Pre-install SDK components + NDK r25b that buildozer/p4a will need
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          # Symlink NDK to the path buildozer expects
          NDK_DEST="$HOME/.buildozer/android/platform/android-ndk-r25b"
          if [ ! -e "$NDK_DEST" ]; then
            ln -s "$SDK/ndk/25.1.8937393" "$NDK_DEST"
          fi

      - name: Verify Android environment
        run: |
          echo "=== NDK ==="
          ls -la "$HOME/.buildozer/android/platform/" 2>/dev/null || echo "platform dir missing"
          echo "=== SDK ==="
          ls "$HOME/.buildozer/android/platform/android-sdk/" 2>/dev/null || echo "SDK missing"

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-debug
          path: bin/*.apk
          retention-days: 90
