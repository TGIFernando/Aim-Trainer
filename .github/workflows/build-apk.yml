name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip python3-dev git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer cython virtualenv

      - name: Bootstrap Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          # Re-use the runner's pre-installed cmdline-tools (avoids downloading)
          ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"

          # Compatibility shim — older p4a/buildozer looks here
          mkdir -p "$SDK/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

          # Accept all licenses (writes hash files into $SDK/licenses/)
          yes | sdkmanager --sdk_root="$SDK" --licenses 2>/dev/null || true

          # Pre-install SDK components buildozer/p4a will need
          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-debug
          path: bin/*.apk
          retention-days: 90
